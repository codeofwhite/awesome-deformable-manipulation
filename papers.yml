# ============================================================
# Awesome Deformable Object Simulation and Manipulation for Embodied AI
# ============================================================
# Scope: deformable object simulation AND manipulation for embodied AI —
# simulation environments, manipulation tasks and methods, sim-to-real,
# benchmarks, asset generation, foundations, and surveys.
#
# To add a new paper: append an entry to the right section.
# Then run: python generate.py
# It will auto-generate README.md (EN) and README.zh-CN.md (CN).
# ============================================================

meta:
  title_en: "Awesome Deformable Object Simulation and Manipulation for Embodied AI"
  title_zh: "Awesome 具身智能柔性物体仿真与操作"
  description_en: "A curated list of resources on deformable object simulation and manipulation (cloth, rope, soft bodies) for embodied intelligence — simulation environments, perception and control, policy learning, sim-to-real transfer, benchmarks, asset generation, and surveys."
  description_zh: "面向具身智能的柔性物体仿真与操作精选资源 — 仿真环境、感知与控制、策略学习、Sim-to-Real 迁移、基准测试、资产生成与综述。"

# Each entry:
#   - title:    paper title
#   - url:      arxiv / project / github link
#   - authors:  (optional) first author et al.
#   - venue:    (optional) conference / journal
#   - year:     publication year
#   - tags:     list of [paper, tool, dataset, benchmark, star]
#   - desc_en:  one-line English description
#   - desc_zh:  one-line Chinese description

sections:
  - id: environments
    title_en: "Simulation Environments & Platforms"
    title_zh: "仿真环境与平台"
    papers:
      - title: "RFUniverse: A Multiphysics Simulation Platform for Embodied AI"
        url: "https://arxiv.org/abs/2202.00199"
        year: 2022
        tags: [paper, tool]
        desc_en: "Multiphysics environment for household robot learning, including soft-body interactions, fluids, airflow, and heat transfer."
        desc_zh: "面向家务机器人学习的多物理环境，覆盖柔性体交互、流体、气流与热传递。"

      - title: "SAPIEN: A SimulAted Part-based Interactive ENvironment"
        url: "https://arxiv.org/abs/2003.08515"
        authors: "Fanbo Xiang, Yuzhe Qin, Kaichun Mo et al."
        venue: CVPR
        year: 2020
        tags: [paper, tool, star]
        desc_en: "Interactive simulation environment based on PhysX, excelling at articulated and deformable object simulation. Widely used in Embodied AI research."
        desc_zh: "基于 PhysX 的交互式仿真环境，擅长铰链体与可变形体仿真，具身智能研究广泛使用。"

      - title: "Genesis World"
        url: "https://genesis-world.readthedocs.io/"
        tags: [tool, star]
        desc_en: "Multi-physics simulation platform covering rigid, deformable, and fluid bodies. 29k+ GitHub stars."
        desc_zh: "多物理仿真平台，覆盖刚体、柔体、流体等，⭐ 29k+ GitHub stars。"

      - title: "SAPIEN ManiSkill"
        url: "https://maniskill2.github.io/"
        authors: "Tongzhou Mu et al."
        venue: NeurIPS (Datasets & Benchmarks)
        year: 2024
        tags: [tool, benchmark, star]
        desc_en: "Unified framework for manipulation skill learning built on SAPIEN, with rich deformable object tasks."
        desc_zh: "基于 SAPIEN 的统一操作技能学习框架，包含丰富的柔性物体任务。"

      - title: "Isaac Sim / Isaac Lab"
        url: "https://developer.nvidia.com/isaac-sim"
        tags: [tool, star]
        desc_en: "NVIDIA's robotics simulation platform with GPU-accelerated deformable body support for large-scale Embodied AI training."
        desc_zh: "NVIDIA 机器人仿真平台，GPU 加速柔性体支持，面向大规模具身智能训练。"

      - title: "MuJoCo"
        url: "https://mujoco.org/"
        tags: [tool, star]
        desc_en: "Advanced physics engine with deformable body simulation support (since v3.x), widely adopted in robotics research."
        desc_zh: "先进物理引擎，v3.x 起支持柔性体仿真，机器人研究广泛采用。"

      - title: "Taichi"
        url: "https://github.com/taichi-dev/taichi"
        tags: [tool]
        desc_en: "High-performance parallel computing language, popular for differentiable soft body simulation in Embodied AI research."
        desc_zh: "高性能并行计算语言，具身智能研究中常用于可微柔体仿真。"

      - title: "Real2Render2Real: Scaling Robot Data Without Dynamics Simulation or Robot Hardware"
        url: "https://arxiv.org/abs/2505.09601"
        year: 2025
        tags: [paper, star]
        desc_en: "Scales robot training data via a Real→Render→Real pipeline without dynamics simulation or physical robot hardware."
        desc_zh: "无需动力学仿真或机器人硬件，通过 Real→Render→Real 流水线大规模生成机器人训练数据。"

  - id: tasks
    title_en: "Deformable Object Manipulation Tasks"
    title_zh: "柔性物体操作任务"
    papers:
      - title: "DexGarmentLab: Dexterous Garment Manipulation Environment with Generalizable Policy"
        url: "https://arxiv.org/abs/2505.11032"
        year: 2025
        tags: [paper, benchmark]
        desc_en: "Bimanual dexterous garment simulation with structural-correspondence demonstration generation and a hierarchical manipulation policy."
        desc_zh: "双手灵巧衣物操作仿真环境，结合结构对应的示范扩增与分层操作策略。"

      - title: "DexDeform: Dexterous Deformable Object Manipulation with Human Demonstrations and Differentiable Physics"
        url: "https://arxiv.org/abs/2304.03223"
        year: 2023
        tags: [paper]
        desc_en: "Learns dexterous soft-object skills from human demonstrations and refines planned actions with differentiable physics."
        desc_zh: "从人类示范学习灵巧软体操作技能，并用可微物理优化规划动作。"

      - title: "GraphGarment: Learning Garment Dynamics for Bimanual Cloth Manipulation Tasks"
        url: "https://arxiv.org/abs/2503.05817"
        year: 2025
        tags: [paper]
        desc_en: "Learns garment dynamics in simulation with graph networks and uses a residual model for real-world bimanual garment hanging."
        desc_zh: "用图网络学习仿真衣物动力学，并以残差模型补偿实机双臂挂衣任务中的预测误差。"

      - title: "GarmentLab: A Unified Simulation and Benchmark for Garment Manipulation"
        url: "https://arxiv.org/abs/2411.01200"
        authors: "Haoran Lu et al."
        venue: NeurIPS
        year: 2024
        tags: [paper, benchmark, star]
        desc_en: "Unified simulation and benchmark for garment manipulation tasks — folding, hanging, dressing."
        desc_zh: "衣物操作的统一仿真与 benchmark — 折叠、悬挂、穿衣等任务。"

      - title: "ClothesNet: An Information-Rich 3D Garment Model Repository with Simulated Clothes Environment"
        url: "https://arxiv.org/abs/2308.09987"
        venue: ICCV
        year: 2023
        tags: [paper, dataset]
        desc_en: "Large-scale 3D garment dataset with rich annotations for manipulation research."
        desc_zh: "大规模衣物 3D 数据集，包含关键点和边界的丰富标注，面向操作研究。"

      - title: "RAPID: Rapid Adaptation of Particle Dynamics for Generalized Deformable Object Mobile Manipulation"
        url: "https://arxiv.org/abs/2603.18246"
        authors: "Bohan Wu, Roberto Martín-Martín, Li Fei-Fei"
        venue: ICRA
        year: 2026
        tags: [paper, star]
        desc_en: "Rapid adaptation of particle dynamics for generalized deformable object mobile manipulation."
        desc_zh: "粒子动力学的快速适应，面向泛化柔性物体移动操作。"

      - title: "Benchmarking the Sim-to-Real Gap in Cloth Manipulation"
        url: "https://arxiv.org/abs/2310.09543"
        venue: arXiv
        year: 2023
        tags: [paper, benchmark]
        desc_en: "Systematic evaluation of the sim-to-real gap in cloth manipulation across different simulators."
        desc_zh: "布料操作中 sim-to-real gap 的系统评测，对仿真器选型有重要参考价值。"

      - title: "SoftMimicGen: A Data Generation System for Scalable Robot Learning in Deformable Object Manipulation"
        url: "https://arxiv.org/abs/2603.25725"
        year: 2026
        tags: [paper, star]
        desc_en: "Extends MimicGen to deformable object manipulation, enabling scalable robot demonstration data generation."
        desc_zh: "MimicGen 在柔性物体操作领域的扩展，实现可扩展的机器人操作数据生成。"

      - title: "DeformGen: Dynamics-Based Topology Augmentation for Deformable Manipulation Policy Learning"
        url: "https://arxiv.org/abs/2606.25939"
        year: 2026
        tags: [paper]
        desc_en: "Dynamics-based topology augmentation for deformable object manipulation policy learning, built on PhysTwin and Real2Render2Real."
        desc_zh: "基于动力学的拓扑增强方法，用于柔性物体操作策略学习，结合 PhysTwin 与 Real2Render2Real。"

  - id: methods
    title_en: "Deformable Object Manipulation Methods"
    title_zh: "柔性物体操作方法"
    papers:
      - title: "Cloth Region Segmentation for Robust Grasp Selection"
        url: "https://arxiv.org/abs/2008.05626"
        year: 2020
        tags: [paper]
        desc_en: "Perception and grasping: segments cloth edges and corners from depth images and selects grasp poses, with real-robot grasp evaluation."
        desc_zh: "感知与抓取：从深度图分割布料边缘和角点并选择抓取位姿，通过实机抓取实验评估。"

      - title: "Center Direction Network for Grasping Point Localization on Cloths"
        url: "https://arxiv.org/abs/2408.14456"
        year: 2024
        tags: [paper, dataset]
        desc_en: "Perception and grasping: CeDiRNet-3DoF localizes cloth grasp points and provides the ViCoS Towel Dataset; evaluates perception rather than a complete manipulation pipeline."
        desc_zh: "感知与抓取：CeDiRNet-3DoF 定位布料抓取点并提供 ViCoS 毛巾数据集，评估重点是感知而非完整操作流程。"

      - title: "Visuotactile Affordances for Cloth Manipulation with Local Control"
        url: "https://arxiv.org/abs/2212.05108"
        year: 2022
        tags: [paper]
        desc_en: "Visuotactile control: grasps cloth edges using visual and tactile affordances, then slides along an edge to a corner with tactile feedback."
        desc_zh: "视触觉控制：融合视觉与触觉可供性抓住布料边缘，再通过触觉反馈沿边滑动至角点。"

      - title: "UniGarmentManip: A Unified Framework for Category-Level Garment Manipulation via Dense Visual Correspondence"
        url: "https://arxiv.org/abs/2405.06903"
        year: 2024
        tags: [paper]
        desc_en: "General garment manipulation: learns category-level dense correspondence to guide unfolding, folding, and hanging with one or few demonstrations."
        desc_zh: "通用衣物操作：学习类别级稠密对应，以一个或少量示范引导展开、折叠与悬挂任务。"

      - title: "CLASP: General-Purpose Clothes Manipulation with Semantic Keypoints"
        url: "https://arxiv.org/abs/2507.19983"
        year: 2025
        tags: [paper]
        desc_en: "General garment manipulation: connects VLM task plans to keypoint-conditioned skills for folding, flattening, hanging, and placing, with dual-arm real-robot evaluation."
        desc_zh: "通用衣物操作：通过语义关键点连接 VLM 任务规划与操作技能，在双臂实机上评估折叠、铺平、悬挂与放置。"

      - title: "Cloth Funnels: Canonicalized-Alignment for Multi-Purpose Garment Manipulation"
        url: "https://arxiv.org/abs/2210.09347"
        year: 2022
        tags: [paper]
        desc_en: "Tidying and folding: combines dynamic flings and pick-and-place actions to canonicalize garment configurations before real-world ironing and folding."
        desc_zh: "整理与折叠：结合动态抖展与抓取放置，将衣物规整到标准配置，为实机熨烫和折叠提供初始状态。"

      - title: "FoldNet: Learning Generalizable Closed-Loop Policy for Garment Folding via Keypoint-Driven Asset and Demonstration Synthesis"
        url: "https://arxiv.org/abs/2505.09109"
        year: 2025
        tags: [paper]
        desc_en: "Tidying and folding: synthesizes keypoint-annotated garment assets and demonstrations and uses KG-DAgger recovery data for closed-loop folding policies evaluated in simulation and reality."
        desc_zh: "整理与折叠：生成带关键点标注的衣物资产和示范，结合 KG-DAgger 恢复数据学习闭环折叠策略，并在仿真与实机上评估。"

      - title: "GarmentPile: Point-Level Visual Affordance Guided Retrieval and Adaptation for Cluttered Garments Manipulation"
        url: "https://arxiv.org/abs/2503.09243"
        year: 2025
        tags: [paper]
        desc_en: "Cluttered garments: learns point-level affordances and adapts entangled piles to support garment retrieval, with simulation and real-world evaluation."
        desc_zh: "堆叠衣物操作：学习点级可供性并调整纠缠衣物堆以支持衣物检索，在仿真与真实场景中评估。"

      - title: "GarmentPile++: Affordance-Driven Cluttered Garments Retrieval with Vision-Language Reasoning"
        url: "https://arxiv.org/abs/2603.04158"
        year: 2026
        tags: [paper]
        desc_en: "Cluttered garments: combines vision-language reasoning, segmentation, affordances, and dual-arm coordination for language-guided garment retrieval."
        desc_zh: "堆叠衣物操作：结合视觉语言推理、分割、可供性与双臂协作，执行语言引导的衣物检索。"

      - title: "DeformPAM: Data-Efficient Learning for Long-horizon Deformable Object Manipulation via Preference-based Action Alignment"
        url: "https://arxiv.org/abs/2410.11584"
        year: 2024
        tags: [paper]
        desc_en: "Policy learning: ranks diffusion-generated action candidates using a human-preference reward model for long-horizon real-world deformable manipulation."
        desc_zh: "策略学习：利用人类偏好奖励模型筛选扩散模型生成的候选动作，支持真实场景中的长时序柔性物体操作。"

      - title: "DeMaVLA: A Vision-Language-Action Foundation Model for Generalizable Deformable Manipulation"
        url: "https://arxiv.org/abs/2605.31286"
        year: 2026
        tags: [paper]
        desc_en: "Policy learning: combines real-world demonstration pretraining, flow-matching actions, and human-in-the-loop corrective data for garment folding across categories."
        desc_zh: "策略学习：结合真实示范预训练、流匹配动作生成与人在回路纠错数据，学习跨类别衣物折叠策略。"

      - title: "Learning to Rearrange Deformable Cables, Fabrics, and Bags with Goal-Conditioned Transporter Networks"
        url: "https://arxiv.org/abs/2012.03385"
        year: 2020
        tags: [paper]
        desc_en: "Multiple object types: uses image-goal-conditioned Transporter Networks for multi-step cable, fabric, and bag manipulation, evaluated in simulation and physical experiments."
        desc_zh: "多类对象操作：以图像目标条件化的 Transporter Networks 执行线缆、织物和袋子的多步操作，在仿真与物理实验中评估。"

      - title: "DextAIRity: Deformable Manipulation Can be a Breeze"
        url: "https://arxiv.org/abs/2203.01197"
        year: 2022
        tags: [paper]
        desc_en: "Airflow-assisted manipulation: combines grasping and closed-loop blowing actions for cloth unfolding and bag opening on a real three-arm system."
        desc_zh: "气流辅助操作：结合抓取与闭环吹气动作，在真实三臂系统上完成布料展开和袋口打开。"

  - id: sim2real
    title_en: "Sim-to-Real Transfer"
    title_zh: "Sim-to-Real 迁移"
    papers:
      - title: "SimWeaver: Zero-Shot RGB Sim-to-Real for Deformable Manipulation"
        url: "https://arxiv.org/abs/2606.15338"
        year: 2026
        tags: [paper]
        desc_en: "Combines measurement-backed cloth simulation, topology-aware trajectory synthesis, and photometric augmentation for RGB policy transfer."
        desc_zh: "结合实测支撑的布料仿真、拓扑感知轨迹合成与光度增强，实现 RGB 操作策略的零样本实机迁移。"

      - title: "SIM1: Physics-Aligned Simulator as Zero-Shot Data Scaler in Deformable Worlds"
        url: "https://arxiv.org/abs/2604.08544"
        year: 2026
        tags: [paper]
        desc_en: "Real-to-sim-to-real data generation with scene digitization, calibrated deformable dynamics, and filtered trajectory synthesis."
        desc_zh: "结合场景数字化、柔性动力学校准和轨迹生成筛选的 real-to-sim-to-real 数据扩增流程。"

      - title: "Sim-to-Real Gentle Manipulation of Deformable and Fragile Objects with Stress-Guided Reinforcement Learning"
        url: "https://arxiv.org/abs/2510.25405"
        year: 2025
        tags: [paper]
        desc_en: "Uses stress-penalized rewards and a rigid-to-deformable curriculum to transfer gentle manipulation policies to fragile real objects."
        desc_zh: "通过应力惩罚奖励与从刚体到柔体的课程训练，将轻柔操作策略迁移到真实易损物体。"

      - title: "Learning to Manipulate Deformable Objects in the Real World via Sim2Real"
        url: "https://arxiv.org/abs/2512.11070"
        venue: arXiv
        year: 2025
        tags: [paper]
        desc_en: "End-to-end sim2real pipeline for deformable object manipulation with domain randomization."
        desc_zh: "端到端 sim2real 流水线，通过域随机化实现柔性物体操作的实机迁移。"

  - id: benchmarks
    title_en: "Benchmarks & Evaluation"
    title_zh: "基准测试与评估"
    papers:
      - title: "DaXBench: Benchmarking Deformable Object Manipulation with Differentiable Physics"
        url: "https://arxiv.org/abs/2210.13066"
        year: 2022
        tags: [paper, benchmark]
        desc_en: "JAX-based differentiable benchmark covering cloth, rope, and fluids for planning, imitation learning, and reinforcement learning."
        desc_zh: "基于 JAX 的可微物理基准，涵盖布料、绳索和流体，支持规划、模仿学习与强化学习评估。"

      - title: "Real Garment Benchmark (RGBench): A Comprehensive Benchmark for Robotic Garment Manipulation featuring a High-Fidelity Scalable Simulator"
        url: "https://arxiv.org/abs/2511.06434"
        year: 2025
        tags: [paper, benchmark, dataset]
        desc_en: "Combines garment meshes, a cloth simulator, and real-motion measurements to evaluate physical simulation fidelity."
        desc_zh: "结合衣物网格、布料仿真器和真实运动测量，评估衣物仿真的物理保真度。"

      - title: "MoDeSuite: Robot Learning Task Suite for Benchmarking Mobile Manipulation with Deformable Objects"
        url: "https://arxiv.org/abs/2507.21796"
        year: 2025
        tags: [paper, benchmark]
        desc_en: "Mobile manipulation task suite for deformable objects, with reinforcement and imitation learning baselines and real-robot transfer experiments."
        desc_zh: "面向柔性物体的移动操作任务集，提供强化学习、模仿学习基线与实机迁移实验。"

      - title: "SoftVTBench: A Safety-Aware Visuo-Tactile Benchmark for Physically Constrained Robotic Manipulation of Deformable Objects (Early Version)"
        url: "https://arxiv.org/abs/2607.04234"
        year: 2026
        tags: [paper, benchmark]
        desc_en: "Early-version visuo-tactile benchmark using FEM deformation states to distinguish task success from physically safe manipulation."
        desc_zh: "早期版本的视触觉基准，利用 FEM 形变状态区分任务成功与满足物理安全约束的操作。"

      - title: "Real-to-Sim Robot Policy Evaluation with Gaussian Splatting Simulation of Soft-Body Interactions"
        url: "https://arxiv.org/abs/2511.04665"
        year: 2025
        tags: [paper]
        desc_en: "Reconstructs soft-body digital twins from videos and evaluates robot policies using physics simulation and Gaussian splatting rendering."
        desc_zh: "从视频重建柔体数字孪生，结合物理仿真与高斯泼溅渲染评估机器人策略。"

      - title: "PokeFlex: A Real-World Dataset of Volumetric Deformable Objects for Robotics"
        url: "https://arxiv.org/abs/2410.07688"
        year: 2024
        tags: [paper, dataset]
        desc_en: "Real-world multimodal deformation data with meshes, RGB-D observations, and interaction forces for learning and validating deformable models."
        desc_zh: "提供网格、RGB-D 观测和交互力的真实体积柔性物体数据，用于形变模型学习与验证。"

      - title: "SoftGym: Benchmarking Deep Reinforcement Learning for Deformable Object Manipulation"
        url: "https://arxiv.org/abs/2011.07215"
        authors: "Xingyu Lin, Yufei Wang, Zixuan Huang, David Held"
        venue: CoRL
        year: 2020
        tags: [paper, benchmark, star]
        desc_en: "Benchmark suite for deformable object manipulation (cloth, rope, fluid) with standardized RL environments."
        desc_zh: "柔性物体操作（布料、绳索、流体）的 benchmark 套件，提供标准化的 RL 环境。"

  - id: generation
    title_en: "3D Asset Generation for Simulation"
    title_zh: "面向仿真的 3D 资产生成"
    papers:
      - title: "EMPM: Embodied MPM for Modeling and Simulation of Deformable Objects"
        url: "https://arxiv.org/abs/2601.17251"
        year: 2026
        tags: [paper]
        desc_en: "Reconstructs deformable objects from RGB-D videos and identifies material parameters with differentiable MPM and online sensory feedback."
        desc_zh: "从 RGB-D 视频重建柔性物体，利用可微 MPM 与在线感知反馈辨识材料参数。"

      - title: "NeuSpring: Neural Spring Fields for Reconstruction and Simulation of Deformable Objects from Videos"
        url: "https://arxiv.org/abs/2511.08310"
        year: 2025
        tags: [paper]
        desc_en: "Reconstructs deformable digital twins using piecewise spring topology and neural spring fields for spatially varying physical properties."
        desc_zh: "通过分区弹簧拓扑与表示空间变化物性的神经弹簧场重建可仿真的柔体数字孪生。"

      - title: "Image2Garment: Simulation-ready Garment Generation from a Single Image"
        url: "https://arxiv.org/abs/2601.09658"
        year: 2026
        tags: [paper]
        desc_en: "Predicts garment geometry and fabric physics from a single image using material attributes and measured material-to-physics mappings."
        desc_zh: "从单图预测衣物几何与面料物理参数，借助材料属性和实测材料到物理参数映射生成可仿真衣物。"

      - title: "PhysX-3D: Physical-Grounded 3D Asset Generation"
        url: "https://arxiv.org/abs/2507.12465"
        authors: "Ziang Cao, Zhaoxi Chen, Liang Pan, Ziwei Liu"
        venue: NeurIPS (Spotlight)
        year: 2025
        tags: [paper, star]
        desc_en: "End-to-end paradigm for physical-grounded 3D asset generation with PhysXNet dataset."
        desc_zh: "端到端的物理驱动 3D 资产生成范式，包含 PhysXNet 数据集。"

      - title: "PhysX-Anything: Simulation-Ready Physical 3D Assets from Single Image"
        url: "https://arxiv.org/abs/2511.13468"
        authors: "Ziang Cao, Fangzhou Hong, Zhaoxi Chen, Liang Pan, Ziwei Liu"
        venue: arXiv
        year: 2025
        tags: [paper]
        desc_en: "Generate simulation-ready 3D assets with physical properties from a single image."
        desc_zh: "从单张图片生成带有物理特性的仿真就绪 3D 资产。"

      - title: "PhysX-Omni: Unified Simulation-Ready Physical 3D Generation for Rigid, Deformable, and Articulated Objects"
        url: "https://arxiv.org/abs/2605.21572"
        venue: arXiv
        year: 2026
        tags: [paper, star]
